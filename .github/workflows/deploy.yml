name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch…
  push:
    branches: [main]
  # …and allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions the GitHub Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        # Official Astro action: installs deps, runs `astro build`, and uploads
        # dist/ as the Pages artifact. `astro build` picks up site + base from
        # astro.config.mjs (base = /penguin-portfolio in production).
        uses: withastro/action@v3
        # Defaults are correct here (npm, node 20, path "."). Uncomment to pin:
        # with:
        #   path: .
        #   node-version: 20
        #   package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
